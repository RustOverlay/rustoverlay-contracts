name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, fetch-tags: true}
      - uses: bufbuild/buf-setup-action@v1
        with: {github_token: "${{ secrets.GITHUB_TOKEN }}"}

      - run: buf lint

      # Against the previous commit on main. Consumers vendor this file and are held byte-identical
      # to it by their own CI, so every commit here is one they will adopt -- there is no released
      # version lagging behind main to compare with instead.
      - name: Breaking-change check
        run: |
          if [ "$(git rev-list --count HEAD)" -lt 2 ]; then
            echo "No parent commit to compare against."
            exit 0
          fi
          buf breaking --against ".git#ref=HEAD~1"
